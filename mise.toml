# 追跡済みのmise.lock（lockfile_version 3）を読める最低版。
min_version = "2026.9.16"

[tools]
uv = "latest"
# Windows CI で `rustup component add` が異なるツールチェーンに当たり cargo-clippy が
# 見つからない事象が出ていたため、mise の rust プラグイン経由で components を一緒に
# インストールする (mise が解決した実体ツールチェーン上に確実に component を導入する)。
# パッチバージョンまで明示するのは mise の partial version 解決ミスでローカルと CI の
# Rust が不一致になるのを防ぐため。MSRV (Cargo.toml `rust-version`) と整合し、
# rust-toolchain.toml も同じ系列を指定する。
# 1.95 系で `collapsible_match` / `while_let_loop` の clippy 動作変更が入ったが、
# Cargo.toml の `[lints.clippy]` で対象 lint を allow 指定して許容している。
rust = { version = "1.95.0", components = "rustfmt,clippy" }
node = "lts"
# pnpm は mise の npm バックエンドで導入し、版を mise.lock、各プラットフォームの
# integrity を `.mise/locks/npm-pnpm/` で固定する。Node.js 25 以降は Corepack を同梱しない。
# mise registry 既定 (`aqua:pnpm/pnpm`) は aqua-registry の Windows アセット命名
# (`pnpm-win-x64`) と上流リリース (`pnpm-win32-x64.zip`) の齟齬で pnpm 11.x の
# Windows runner インストールが失敗したため、npm バックエンドを明示する。
# `package.json` の `packageManager` で固定すると pnpm-lock.yaml の先頭に版の記録
# （boot 文書）が加わり、GitHub の Dependency Graph が lockfile を解釈できなくなるため、
# 版の照合は `pnpm-workspace.yaml` の `pmOnFail: ignore` で mise 側へ任せる。
"npm:pnpm" = "latest"
pinact = "latest"
git-cliff = "latest"
typos = "latest"
# cargo-deny は mise の core registry に存在しない (2026-04-29 時点で
# `mise registry cargo-deny` は "tool not found in registry" を返す) ため、
# aqua バックエンド経由で EmbarkStudios/cargo-deny を取得する。
# pyfltr は `cargo-deny-version` 既定値 (`"latest"`) のまま mise.toml に
# cargo-deny のツール定義を見つけると、tool spec を省略して
# `mise exec -- cargo-deny` を組み立てる。
# core registry へ登録されたら本指定を撤去し既定の mise exec 経由に戻すことができる。
"aqua:EmbarkStudios/cargo-deny" = "latest"

# actionlint の配布物はインストール root へ実行ファイルと並んで `man`・`docs` の
# ディレクトリを展開する。mise は `bin` サブディレクトリを持たないツールのインストール
# root をそのまま PATH へ追加するため、`man` が PATH 上で `/usr/bin/man` より先に
# 解決され、mise の shim 経由の `man` がディレクトリを exec して失敗する。
# `symlink_bins` を有効にすると実行ファイルだけが `.mise-bins` へ集められ、
# PATH にはこのディレクトリが追加される。既に actionlint を導入済みの環境では、
# 再インストール
# (`mise install --force actionlint`) または版の更新まで本設定は反映されない。
# options を保つため inline table ではなく別テーブルで書く
# (`mise upgrade --bump` は inline table を単一の文字列へ平坦化して options を失う)。
# 本ブロックは `[tools]` の最後のキーより後に置く。より前へ移動すると、後続のキーが
# `[tools]` ではなく `[tools.actionlint]` のキーとして解釈される。
[tools.actionlint]
version = "latest"
symlink_bins = true

[tasks.setup]
description = "開発環境のセットアップ"
# rustfmt / clippy の component インストールは mise の `[tools].rust` 側に集約している。
# cargo-deny は `[tools]` の aqua バックエンド指定で `mise install` 時に解決されるため、
# `cargo install cargo-deny` は重複インストールになるので外している。
# `mise run setup-linux`が生成する`.mise.local.toml`は`CARGO_BUILD_TARGET`をWindowsターゲットにするため、
# ホスト向けのツール導入ではこれを外す（外さないと`cargo install`もWindows向けにビルドする）。
run = [
  "env -u CARGO_BUILD_TARGET cargo install cargo-edit",
  "pnpm install",
  "git config --unset core.hooksPath || true",
  "uvx prek install -c .pre-commit-config.yaml",
  "git config --local commit.template .gitmessage",
]
run_windows = [
  "cargo install cargo-edit",
  "pnpm install",
  "git config --unset core.hooksPath & exit /b 0",
  "uvx prek install -c .pre-commit-config.yaml",
  "git config --local commit.template .gitmessage",
]

[tasks.setup-linux]
description = "LinuxからWindows向けにクロスビルドする開発環境のセットアップ（Debian/Ubuntu、sudoを使う）"
# cargo-xwinの環境をGit管理外の`.mise.local.toml`へ保存してから、通常のセットアップを行う。
# 以後の`mise run test`はclippy・cargo-deny・テストのコンパイルまで（テストの実行はWindows CI）、
# `mise run build`の成果物は`target/x86_64-pc-windows-msvc/release/`へ出力される。RAR展開は除外される。
run = [
  "uv run --no-project scripts/setup_linux.py",
  "mise run setup",
]

[tasks.setup-ci]
description = "CI環境のセットアップ (cargo install をスキップ)"
# `[tools].rust` 側で components を指定しているが、Windows CI で mise の rust
# プラグインが components を解決しないことがある (2026-04-29 時点で mise 2026.4.25
# にて再現: ログには "info: downloading 5 components" が出るが、後段で
# `'cargo-clippy.exe' is not installed for the toolchain` エラーになる)。
# mise が設定する RUSTUP_TOOLCHAIN を使い rustup から明示的に冪等補強する。
run = [
  "rustup component add rustfmt clippy",
  "pnpm install",
]

[tasks.build]
description = "リリースビルド"
run = "cargo build --release --locked"

[tasks.clean]
description = "ビルド成果物の削除"
run = "cargo clean"

[tasks.format]
description = "フォーマット + 軽量lint（開発時の手動実行用。自動修正あり）"
run = [
  # pyfltrの推奨ガイドから意図して外れる指定。グローバルuv設定の`exclude-newer`があっても
  # 公開直後のpyfltrを使うため、コマンドラインでpyfltrだけを公開待機から外す。
  "uvx --exclude-newer-package pyfltr=false pyfltr fast",
]

[tasks.test]
description = "全チェック実行（これを通過すればコミット可能）"
run = [
  "uvx --exclude-newer-package pyfltr=false pyfltr run",
]

[tasks.update]
description = "依存パッケージの更新"
# `mise lock --bump` は pnpm を含む `latest`・`lts` 指定の開発ツールを再解決して mise.lock を更新する。
# rust は rust-toolchain.toml・Cargo.toml の `rust-version` と揃えて固定しているため
# `mise upgrade --bump` で書き換えず、固定版を手で変えたときも本コマンドがロックへ反映する。
# pnpm 本体を先に更新して導入してから、新しい pnpm を `mise exec` で起動して依存を更新し、
# 新しい pnpm の依存解決規則を反映した状態でロックファイルを再生成する。
# `CI=true` は pnpm の対話プロンプトを抑止し、TTY が無い非対話実行でもエラーにせず進める。
env = { CI = "true" }
run = [
  "cargo upgrade --incompatible",
  "cargo update",
  "mise lock --bump",
  "mise install",
  "mise exec -- pnpm update --latest",
  "pinact run --update --min-age 1",
]

[tasks.bench]
description = "表示時間の測定（Windows実機・リリースプロファイル。結果はtarget/gv-bench/へ保存）"
# 通常のcargo testとCIでは実行しない`#[ignore]`のテストを、名前を完全一致で指定して起動する
run = "cargo test --release -- --ignored --exact app::benchmark::tests::display_benchmark --nocapture"

[tasks.bench-compare]
description = "表示時間の測定結果2件の比較（mise run bench-compare -- <基準JSON> <比較JSON>）"
run = "uv run --no-project scripts/compare_display_bench.py"

[tasks.bench-memory]
description = "巨大画像の表示・UI応答回収停止中のプロセスメモリー実測"
run = "cargo test --release --locked -- --ignored --exact app::benchmark::tests::large_image_memory_benchmark --nocapture"

[tasks.docs]
description = "ドキュメントのローカルプレビュー"
run = "pnpm run docs:dev"
