# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
      - id: detect-private-key
      # pyfltrの推奨ガイドから意図して外れる指定。`patches/`の依存パッチは文脈行の行末空白や改行まで
      # 適用先のソースと一致する必要があり、整形すると内容とpnpm-lock.yamlのpatch_hashが変わるため、
      # 空白と改行を整形する3つのhookの対象から外す。
      - id: end-of-file-fixer
        exclude: ^patches/
      - id: mixed-line-ending
        exclude: ^patches/
      - id: trailing-whitespace
        exclude: ^patches/

  - repo: local
    hooks:
      - id: pyfltr
        name: pyfltr
        # pyfltrの推奨ガイドから意図して外れる指定。グローバルuv設定の`exclude-newer`があっても
        # 公開直後のpyfltrを使うため、コマンドラインでpyfltrだけを公開待機から外す。
        entry: uvx --exclude-newer-package pyfltr=false pyfltr fast
        types_or: [rust, python, markdown, toml, yaml, javascript, ts]
        require_serial: true
        language: system
      - id: vitepress-build
        name: VitePress build
        entry: corepack pnpm run docs:build
        language: system
        pass_filenames: false
        files: ^docs/.*\.(md|ts|json)$|^docs/\.vitepress/
      - id: skip-hook-ids
        name: SKIP指定とhook IDの照合
        entry: uv run --no-project scripts/check_skip_hook_ids.py
        language: system
        pass_filenames: false
        files: ^(AGENTS\.md|\.pre-commit-config\.yaml)$
