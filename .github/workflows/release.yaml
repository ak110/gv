name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: バージョン番号の更新タイプ
        required: true
        type: choice
        options:
          - PATCH
          - MINOR
          - MAJOR
        default: PATCH

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      # mise等がGitHub APIを呼び出す際のレート制限（403）回避。
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Verify CI passed
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
        shell: pwsh
        run: |
          $maxAttempts = 45
          $intervalSec = 20
          for ($i = 1; $i -le $maxAttempts; $i++) {
            # check-suites APIはこのリリースワークフロー自身のsuiteも返し順序が不定なため、CI workflowの実行を直接照会する
            $conclusion = gh run list --repo=${{ github.repository }} --workflow=ci.yaml --commit=${{ github.sha }} `
              --limit=1 --json=conclusion --jq='.[0].conclusion'
            if ($conclusion -eq "success") {
              Write-Host "CI passed."
              exit 0
            }
            if ($conclusion -and $conclusion -ne "null") {
              if ($env:REF_TYPE -eq "tag") {
                Write-Error ("このタグのCIが成功していない (status: $conclusion)。" +
                  "同じタグのCIログを確認し、一時的な原因ならCIを再実行する。" +
                  "CIが成功した後、このRelease workflowを再実行する。" +
                  "タグのcommit自体の修正が必要なら、同じタグのZIPは補完できない。" +
                  "修正後のcommitでCIを成功させ、新しい版をリリースする。")
                exit 1
              }
              Write-Error ("このcommitのCIが成功していない (status: $conclusion)。" +
                "gh run list --workflow=ci.yaml --commit=${{ github.sha }} で失敗したジョブを確認して修正し、" +
                "修正をpushしてCIが成功した後に、releaserでリリースし直す。")
              exit 1
            }
            Write-Host "CI still running... waiting ${intervalSec}s (attempt $i/$maxAttempts)"
            Start-Sleep -Seconds $intervalSec
          }
          Write-Error ("CIの完了待ちが時間切れになった (待機 $($maxAttempts * $intervalSec)秒)。" +
            "タグから起動した場合にCI実行がなければ gh workflow run ci.yaml --ref <タグ> で起動する。" +
            "CIの成功を確認してから、このworkflowを再実行する。")
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Prepare release from verified source
        id: release
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          VERSION_BUMP: ${{ inputs.bump }}
        run: |
          uv run --no-project scripts/release.py prepare --source-commit $env:SOURCE_COMMIT --bump $env:VERSION_BUMP --output-file $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure git identity
        if: steps.release.outputs.rerun != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build verified dependencies
        run: mise run build

      - name: Create release archive
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $zipName = "gv-v$version.zip"
          # Cargo.tomlの[[bin]] name = "ぐらびゅ" によりこの名前で生成される
          Compress-Archive -Path @(
            "target/release/ぐらびゅ.exe",
            "ぐらびゅ.default.toml",
            "ぐらびゅ.keys.default.toml",
            "README.md",
            "LICENSE"
          ) -DestinationPath $zipName

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: gv-v${{ steps.release.outputs.version }}.zip

      - name: Update version.json for GitHub Pages
        if: steps.release.outputs.rerun != 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $json = @{
            tag_name = "v$version"
            download_url = "https://github.com/${{ github.repository }}/releases/download/v$version/gv-v$version.zip"
          } | ConvertTo-Json
          Set-Content -Path "docs/public/version.json" -Value $json

      - name: Commit, tag and push
        if: steps.release.outputs.rerun != 'true'
        run: |
          git add Cargo.toml Cargo.lock docs/public/version.json
          git commit -m "release: v${{ steps.release.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git tag "${{ steps.release.outputs.tag }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push --atomic origin HEAD --tags

      - name: Generate release notes
        shell: pwsh
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $previousTag = git describe --tags --abbrev=0 --match 'v[0-9]*' "$tag^"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git cliff "$previousTag..$tag" --strip=header --output=CHANGES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Append changelog link
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $tag = "${{ steps.release.outputs.tag }}"
          $prevTag = git describe --tags --abbrev=0 --match 'v[0-9]*' "$tag^"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content CHANGES.md "`n**Full Changelog**: https://github.com/${{ github.repository }}/compare/$prevTag...v$version"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $asset = "gv-v$version.zip"
          uv run --no-project scripts/release.py publish --repository "${{ github.repository }}" --tag "${{ steps.release.outputs.tag }}" --asset $asset --notes CHANGES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Trigger docs deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yaml
