name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: バージョン番号の更新タイプ
        required: true
        type: choice
        options:
          - PATCH
          - MINOR
          - MAJOR
        default: PATCH

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      # mise等がGitHub APIを呼び出す際のレート制限（403）回避。
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Verify CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $maxAttempts = 45
          $intervalSec = 20
          for ($i = 1; $i -le $maxAttempts; $i++) {
            # check-suites APIはこのリリースワークフロー自身のsuiteも返し順序が不定なため、CI workflowの実行を直接照会する
            $conclusion = gh run list --repo=${{ github.repository }} --workflow=ci.yaml --commit=${{ github.sha }} `
              --limit=1 --json=conclusion --jq='.[0].conclusion'
            if ($conclusion -eq "success") {
              Write-Host "CI passed."
              exit 0
            }
            if ($conclusion -and $conclusion -ne "null") {
              # 完了しているが success ではない
              Write-Error "CI failed on this commit (status: $conclusion)."
              exit 1
            }
            Write-Host "CI still running... waiting ${intervalSec}s (attempt $i/$maxAttempts)"
            Start-Sleep -Seconds $intervalSec
          }
          Write-Error "Timed out waiting for CI to complete (waited $($maxAttempts * $intervalSec)s)."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Prepare release from verified source
        id: release
        shell: pwsh
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          VERSION_BUMP: ${{ inputs.bump }}
        run: |
          uv run --no-project scripts/release.py prepare --source-commit $env:SOURCE_COMMIT --bump $env:VERSION_BUMP --output-file $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure git identity
        if: steps.release.outputs.rerun != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build verified dependencies
        run: mise run build

      - name: Create release archive
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $zipName = "gv-v$version.zip"
          # Cargo.tomlの[[bin]] name = "ぐらびゅ" によりこの名前で生成される
          Compress-Archive -Path @(
            "target/release/ぐらびゅ.exe",
            "ぐらびゅ.default.toml",
            "ぐらびゅ.keys.default.toml",
            "README.md",
            "LICENSE"
          ) -DestinationPath $zipName

      - name: Update version.json for GitHub Pages
        if: steps.release.outputs.rerun != 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $json = @{
            tag_name = "v$version"
            download_url = "https://github.com/${{ github.repository }}/releases/download/v$version/gv-v$version.zip"
          } | ConvertTo-Json
          Set-Content -Path "docs/public/version.json" -Value $json

      - name: Commit, tag and push
        if: steps.release.outputs.rerun != 'true'
        run: |
          git add Cargo.toml Cargo.lock docs/public/version.json
          git commit -m "release: v${{ steps.release.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git tag "${{ steps.release.outputs.tag }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push --atomic origin HEAD --tags

      - name: Generate release notes
        shell: pwsh
        run: |
          $tag = "${{ steps.release.outputs.tag }}"
          $previousTag = git describe --tags --abbrev=0 --match 'v[0-9]*' "$tag^"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git cliff "$previousTag..$tag" --strip=header --output=CHANGES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Append changelog link
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $tag = "${{ steps.release.outputs.tag }}"
          $prevTag = git describe --tags --abbrev=0 --match 'v[0-9]*' "$tag^"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content CHANGES.md "`n**Full Changelog**: https://github.com/${{ github.repository }}/compare/$prevTag...v$version"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $asset = "gv-v$version.zip"
          uv run --no-project scripts/release.py publish --repository "${{ github.repository }}" --tag "${{ steps.release.outputs.tag }}" --asset $asset --notes CHANGES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Trigger docs deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yaml
