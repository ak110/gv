name: 標準しおりダイアログの一時観測

on:
  push:
    branches:
      - pwi-ae3f-gv-bookmark-probe

permissions:
  contents: read

concurrency:
  group: bookmark-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 526ab9ebc62d3811358dcb771652758ecae3452d
          path: probe-base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3bcb8c4c3261d7e124a99fff14db438a748407b3
          path: probe-candidate
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: 変更していない2版をビルド
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/bookmark-probe-target
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @{
            base = '526ab9ebc62d3811358dcb771652758ecae3452d'
            candidate = '3bcb8c4c3261d7e124a99fff14db438a748407b3'
          }
          foreach ($variant in @('base', 'candidate')) {
            Push-Location "probe-$variant"
            try {
              $revision = git rev-parse HEAD
              if ($LASTEXITCODE -ne 0 -or $revision -cne $expected[$variant]) {
                throw "対象版が一致しない: $variant"
              }
              Write-Host "build $variant $revision"
              mise trust
              if ($LASTEXITCODE -ne 0) { throw "mise trust 失敗: $variant" }
              mise run build
              if ($LASTEXITCODE -ne 0) { throw "ビルド失敗: $variant" }
              git diff --exit-code HEAD --
              if ($LASTEXITCODE -ne 0) { throw "ビルドした版に追跡ファイルの差分がある: $variant" }
              $out = Join-Path $env:RUNNER_TEMP "bookmark-probe-$variant"
              New-Item -Path $out -ItemType Directory | Out-Null
              Copy-Item -LiteralPath (Join-Path $env:CARGO_TARGET_DIR 'release/ぐらびゅ.exe') -Destination (Join-Path $out 'gv.exe')
            } finally {
              Pop-Location
            }
          }
      - name: 標準保存と読み込みを観測
        shell: pwsh
        timeout-minutes: 7
        run: ./scripts/bookmark_probe.ps1
