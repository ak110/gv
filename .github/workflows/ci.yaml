name: CI

on:
  push:
    tags-ignore:
      - "*"
    branches:
      - "**"
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    env:
      # mise等がGitHub APIを呼び出す際のレート制限（403）回避。
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      # cargo-deny は mise.toml の `aqua:EmbarkStudios/cargo-deny` 指定により
      # mise-action 経由でインストールされ、pyfltr が `mise exec -- cargo-deny` で実行する。
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: mise run setup-ci
      - name: advisory DB の CRLF 変換を防止
        run: git config --global core.autocrlf false
      # pyfltrの推奨ガイドから意図して外れる指定。グローバルuv設定の`exclude-newer`があっても
      # 公開直後のpyfltrを使うため、コマンドラインでpyfltrだけを公開待機から外す。
      - run: uvx --exclude-newer-package pyfltr=false pyfltr ci --output-format=github-annotations
