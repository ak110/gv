name: CI

on:
  push:
    tags-ignore:
      - "*"
    branches:
      - "**"
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    env:
      # mise・pinact等がGitHub APIを呼び出す際のレート制限（403）回避。
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      # cargo-deny は mise.toml の `aqua:EmbarkStudios/cargo-deny` 指定により
      # mise-action 経由でインストールされ、pyfltr が `mise exec -- cargo-deny` で実行する。
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: mise run setup-ci
      - name: advisory DB の CRLF 変換を防止
        run: git config --global core.autocrlf false
      - run: uvx pyfltr ci --output-format=github-annotations
      - run: pinact run --check
